<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PULSEFALL · Gravity Shift</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d20;color:#fff;font-family:system-ui,sans-serif;touch-action:none}#game{position:absolute;inset:0;width:100%;height:100%}#hud{position:absolute;top:env(safe-area-inset-top,8px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;text-shadow:0 2px 6px #000}#hud button{pointer-events:auto}button{color:white;border:2px solid #ffffff65;background:#17274ccc;border-radius:18px;font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none}#controls{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:18px;right:18px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}#controls button{pointer-events:auto;width:72px;height:72px;font-size:25px;box-shadow:0 6px 0 #070c1a,0 0 20px #00d9ff25}#controls button:active,.held{background:#146b95;transform:translateY(4px);box-shadow:0 2px 0 #070c1a}#controls .shift{width:100px;height:86px;background:#6731a6dd;font-size:15px}#overlay{position:absolute;inset:0;background:#060b1dc9;display:grid;place-items:center;text-align:center;padding:25px}#panel{max-width:440px;padding:30px;border:1px solid #72e9ff7d;border-radius:24px;background:#142044ee;box-shadow:0 0 70px #19d6ff30}#panel h1{font-size:clamp(32px,7vw,55px);margin:0 0 10px;letter-spacing:2px}#panel p{line-height:1.6}#play{font-size:21px;padding:15px 40px;background:#167b91}#tip{position:absolute;top:56px;left:10px;right:10px;text-align:center;font-size:12px;color:#b5c7e5;pointer-events:none}@media(max-height:500px){#controls button{height:58px;width:64px}#controls .shift{height:65px;width:85px}#tip{display:none}}</style></head><body><canvas id="game"></canvas><div id="hud"><b id="score">PULSEFALL · 0/0</b><button id="pause" style="padding:9px 14px">Ⅱ</button></div><div id="tip">Collect every energy pulse, then enter the portal · Shift gravity to cross the void</div><div id="controls"><div style="display:flex;gap:14px"><button id="left" aria-label="Move left">◀</button><button id="right" aria-label="Move right">▶</button></div><button id="shift" class="shift" aria-label="Shift gravity">⇅<br>SHIFT</button><button id="dash" class="shift" aria-label="Dash" style="background:#116a74dd">➜<br>DASH</button></div><div id="overlay"><div id="panel"><h1 id="title">PULSEFALL</h1><p id="description">GRAVITY SHIFT<br>Collect energy pulses. Flip between floor and ceiling to dodge voids and escape the collapsing reactor.<br><br>Move ◀ ▶ · SHIFT reverses gravity · DASH crosses gaps.</p><button id="play">PLAY</button></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),title=document.getElementById('title'),description=document.getElementById('description'),score=document.getElementById('score');let w=960,h=540,scale=1,offsetX=0,offsetY=0,last=0,acc=0,mode='menu',level=0,dead=0,particles=[],pulsePhase=0,shiftQueued=false,shiftHeld=false;const keys={left:false,right:false};const stages=[{floor:[[0,215],[300,510],[890,960]],roof:[[0,390],[455,760],[825,960]],orbs:[[150,430],[365,110],[650,430]],hazards:[[365,430],[545,110]],exit:[928,430]},{floor:[[0,160],[240,405],[510,685],[780,960]],roof:[[0,280],[350,535],[620,875]],orbs:[[90,430],[410,110],[615,430],[815,110]],hazards:[[300,430],[675,110]],exit:[925,430]},{floor:[[0,170],[275,465],[560,730],[840,960]],roof:[[0,260],[360,580],[665,960]],orbs:[[125,110],[385,430],[700,110],[885,430]],hazards:[[370,110],[620,430],[780,110]],exit:[932,430]},{floor:[[0,145],[255,380],[480,595],[715,960]],roof:[[0,240],[320,465],[565,800],[875,960]],orbs:[[110,110],[325,430],[570,110],[770,430],[910,110]],hazards:[[245,430],[490,110],[685,430],[830,110]],exit:[930,430]},{floor:[[0,180],[280,390],[490,635],[755,960]],roof:[[0,260],[370,540],[620,840]],orbs:[[140,430],[350,110],[520,430],[710,110],[880,430]],hazards:[[250,110],[440,430],[650,110],[805,430]],exit:[925,430]},{floor:[[0,130],[240,355],[455,565],[665,770],[870,960]],roof:[[0,205],[305,440],[540,665],[745,915]],orbs:[[110,110],[300,430],[490,110],[690,430],[810,110],[925,430]],hazards:[[205,430],[380,110],[600,430],[780,110],[875,430]],exit:[932,430]}];let player,orbs,stage,camShake=0,dashQueued=false,dashHeld=false,trail=[],levelTime=0;function init(){stage=stages[level];orbs=stage.orbs.map(([x,y])=>({x,y,taken:false}));player={x:48,y:392,vx:0,vy:0,g:1,r:15,inv:0,dashCooldown:0};trail=[];levelTime=0;update()}function update(){score.textContent='STAGE '+(level+1)+'/'+stages.length+' · ENERGY '+orbs.filter(o=>o.taken).length+'/'+orbs.length+' · FALLS '+dead}function show(head,desc,btn){mode='menu';title.textContent=head;description.innerHTML=desc;document.getElementById('play').textContent=btn;overlay.style.display='grid'}function begin(){level=0;dead=0;init();mode='playing';overlay.style.display='none'}document.getElementById('play').onclick=()=>{if(level>=stages.length)begin();else{mode='playing';overlay.style.display='none'}};const dashBtn=document.getElementById('dash');dashBtn.addEventListener('pointerdown',e=>{e.preventDefault();dashBtn.setPointerCapture(e.pointerId);if(!dashHeld){dashQueued=true;dashHeld=true;dashBtn.classList.add('held')}});for(const t of ['pointerup','pointercancel','lostpointercapture'])dashBtn.addEventListener(t,()=>{dashHeld=false;dashBtn.classList.remove('held')});document.getElementById('pause').onclick=()=>{if(mode==='playing')show('PAUSED','Resume the reactor run.','RESUME');else if(mode==='menu'&&overlay.style.display==='grid'){mode='playing';overlay.style.display='none'}};function hold(id,key){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);keys[key]=true;el.classList.add('held')});for(let t of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(t,()=>{keys[key]=false;el.classList.remove('held')})}hold('left','left');hold('right','right');const sh=document.getElementById('shift');sh.addEventListener('pointerdown',e=>{e.preventDefault();sh.setPointerCapture(e.pointerId);if(!shiftHeld){shiftQueued=true;shiftHeld=true;sh.classList.add('held')}});for(let t of ['pointerup','pointercancel','lostpointercapture'])sh.addEventListener(t,()=>{shiftHeld=false;sh.classList.remove('held')});document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','ArrowUp','KeyA','KeyD','KeyW'].includes(e.code))e.preventDefault();if(['ArrowLeft','KeyA'].includes(e.code))keys.left=true;if(['ArrowRight','KeyD'].includes(e.code))keys.right=true;if(['Space','ArrowUp','KeyW'].includes(e.code)&&!e.repeat)shiftQueued=true;if(e.code==='ShiftLeft'||e.code==='ShiftRight')dashQueued=true;if(e.code==='Escape')document.getElementById('pause').click()});document.addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))keys.left=false;if(['ArrowRight','KeyD'].includes(e.code))keys.right=false});window.addEventListener('blur',()=>{keys.left=keys.right=false;shiftHeld=false;if(mode==='playing')show('PAUSED','Game paused when the window lost focus.','RESUME')});function resize(){let d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);scale=Math.min(canvas.width/w,canvas.height/h);offsetX=(canvas.width-w*scale)/2;offsetY=(canvas.height-h*scale)/2}addEventListener('resize',resize);resize();function sparks(x,y,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=Math.random()*5+1;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:35,color})}}function fail(){dead++;camShake=12;sparks(player.x,player.y,'#ff507e',24);init()}function overlaps(a,b){return Math.abs(a.x-b.x)<a.r+b.r&&Math.abs(a.y-b.y)<a.r+b.r}function step(){pulsePhase+=.03;for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)particles.splice(i,1)}if(mode!=='playing')return;levelTime++;if(player.dashCooldown>0)player.dashCooldown--;if(dashQueued){if(player.dashCooldown===0){player.vx=(keys.left?-1:1)*16;player.dashCooldown=110;sparks(player.x,player.y,'#42ffe8',22)}dashQueued=false}if(shiftQueued){player.g*=-1;player.vy=player.g*2;sparks(player.x,player.y,'#69e7ff',12);shiftQueued=false}player.vx+=(Number(keys.right)-Number(keys.left))*1.1;player.vx*=.91;player.vx=Math.max(-12,Math.min(12,player.vx));player.x=Math.max(player.r,Math.min(w-player.r,player.x+player.vx));let oldY=player.y;player.vy=Math.max(-10,Math.min(10,player.vy+.6*player.g));player.y+=player.vy;let surfaces=player.g>0?stage.floor:stage.roof;let target=player.g>0?445:95;for(let [a,b] of surfaces){if(player.x+player.r>a&&player.x-player.r<b){if(player.g>0&&oldY+player.r<=target&&player.y+player.r>=target){player.y=target-player.r;player.vy=0}else if(player.g<0&&oldY-player.r>=target&&player.y-player.r<=target){player.y=target+player.r;player.vy=0}}}if(player.y>h+35||player.y< -35){fail();return}for(let [hx,hy] of stage.hazards){let x=hx+Math.sin(levelTime*.035+hx)*38,y=hy+Math.sin(levelTime*.021+hx)*18;if(overlaps({...player,r:player.r-3},{x,y,r:21})){fail();return}}for(let o of orbs){if(!o.taken&&overlaps({...player,r:player.r+5},{...o,r:15})){o.taken=true;sparks(o.x,o.y,'#ffe879');update()}}trail.push({x:player.x,y:player.y,g:player.g});if(trail.length>14)trail.shift();let [ex,ey]=stage.exit;if(orbs.every(o=>o.taken)&&Math.hypot(player.x-ex,player.y-ey)<38){sparks(ex,ey,'#65ffa8',30);level++;if(level===stages.length){show('REACTOR SAVED!','All six gravity chambers cleared. Total falls: '+dead+'<br>Can you finish with fewer falls?','PLAY AGAIN')}else{init();show('CHAMBER CLEARED','Energy restored. The next chamber introduces new gaps and hazards.','NEXT STAGE')}}}function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#070c1d';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.setTransform(scale,0,0,scale,offsetX,offsetY);let grd=ctx.createLinearGradient(0,0,0,h);grd.addColorStop(0,'#122651');grd.addColorStop(.5,'#0b1430');grd.addColorStop(1,'#1c1840');ctx.fillStyle=grd;ctx.fillRect(0,0,w,h);for(let i=0;i<55;i++){let sx=(i*197+Math.sin(pulsePhase*.15+i)*12)%w,sy=(i*97)%h;ctx.fillStyle='rgba(127,207,255,'+(.1+(i%5)*.07)+')';ctx.fillRect(sx,sy,2+(i%3),2+(i%3))}ctx.fillStyle='#20d9ff10';ctx.beginPath();ctx.arc(750,230,170+Math.sin(pulsePhase)*15,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#6ad9ff12';ctx.lineWidth=1;for(let i=0;i<w;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,h);ctx.stroke()}for(let i=0;i<h;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(w,i);ctx.stroke()}ctx.save();ctx.translate((Math.random()-.5)*camShake,(Math.random()-.5)*camShake);camShake*=.85;for(let [a,b] of stage.floor){ctx.fillStyle='#204c69';ctx.fillRect(a,445,b-a,32);ctx.fillStyle='#63dfff';ctx.shadowColor='#63dfff';ctx.shadowBlur=12;ctx.fillRect(a,445,b-a,6);ctx.shadowBlur=0}for(let [a,b] of stage.roof){ctx.fillStyle='#204c69';ctx.fillRect(a,65,b-a,30);ctx.fillStyle='#63dfff';ctx.shadowColor='#63dfff';ctx.shadowBlur=12;ctx.fillRect(a,90,b-a,5);ctx.shadowBlur=0}for(let [hx,hy] of stage.hazards){let x=hx+Math.sin(levelTime*.035+hx)*38,y=hy+Math.sin(levelTime*.021+hx)*18;ctx.save();ctx.translate(x,y);ctx.rotate(pulsePhase);ctx.fillStyle='#ff507e';for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);ctx.fillRect(-5,-26,10,15)}ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.restore()}for(let o of orbs){if(o.taken)continue;let r=11+Math.sin(pulsePhase*2+o.x)*3;ctx.shadowColor='#ffe878';ctx.shadowBlur=20;ctx.fillStyle='#ffe878';ctx.beginPath();ctx.arc(o.x,o.y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}let [ex,ey]=stage.exit;ctx.strokeStyle=orbs.every(o=>o.taken)?'#69ffb3':'#71849c';ctx.lineWidth=7;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=22;ctx.beginPath();ctx.ellipse(ex,ey,17,33,0,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;for(let p of particles){ctx.globalAlpha=p.life/35;ctx.fillStyle=p.color;ctx.fillRect(p.x-3,p.y-3,6,6)}ctx.globalAlpha=1;for(let i=0;i<trail.length;i++){let t=trail[i];ctx.globalAlpha=i/trail.length*.3;ctx.fillStyle=t.g>0?'#49dfff':'#d36aff';ctx.beginPath();ctx.arc(t.x,t.y,4+i*.55,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.vx*.035);ctx.shadowColor='#58dfff';ctx.shadowBlur=25;ctx.fillStyle='#74e5ff';ctx.beginPath();ctx.roundRect(-15,-15,30,30,9);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#112b47';ctx.fillRect(player.vx>=0?4:-9,-6,5,5);ctx.fillStyle='#fff';ctx.fillRect(-5,6,10,3);ctx.strokeStyle=player.g>0?'#38ffba':'#f09bff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,21,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-player.dashCooldown/110));ctx.stroke();ctx.restore();ctx.restore()}function frame(t){let dt=Math.min(50,t-last);last=t;acc+=dt;let n=0;while(acc>=1000/60&&n++<3){step();acc-=1000/60}draw();requestAnimationFrame(frame)}init();requestAnimationFrame(frame);})();
</script></body></html>
