<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PULSEFALL</title><style>html,body{margin:0;background:#101528;color:white;font-family:system-ui;overflow:hidden}canvas{display:block;width:100vw;height:75vh;touch-action:none}header{padding:10px;display:flex;justify-content:space-between}button{background:#293a64;color:white;border:1px solid #8ca8f7;border-radius:12px;padding:14px;font-size:20px;touch-action:none}.controls{display:flex;justify-content:space-between;padding:12px}.controls div{display:flex;gap:12px}#msg{text-align:center}</style><header><strong>PULSEFALL</strong><span id="stats">Level 1 · Falls 0</span><button id="restart">Restart</button></header><canvas id="game"></canvas><div class="controls"><div><button id="left">◀</button><button id="right">▶</button></div><button id="jump">JUMP ▲</button></div><div id="msg">Reach the green portal. Avoid the red spikes.</div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),stats=document.getElementById('stats'),msg=document.getElementById('msg');let W=900,H=500,level=0,falls=0,won=false;const keys={left:false,right:false,jump:false};let p,plats,spikes,portal,checkpoint,activated;const maps=[{g:[[0,220],[300,140],[510,130],[740,160]],s:[[220,80],[440,70],[640,80]],cp:530},{g:[[0,160],[230,110],[420,110],[610,100],[800,100]],s:[[165,65],[350,70],[540,65],[715,65]],cp:445},{g:[[0,135],[200,100],[380,85],[550,80],[700,95],[855,45]],s:[[140,65],[305,70],[470,65],[635,60],[800,50]],cp:565}];function reset(full=false){if(full){level=0;falls=0}let m=maps[level];plats=m.g.map(([a,b])=>({x:a,w:b}));spikes=m.s.map(([a,b])=>({x:a,w:b}));portal={x:level===2?865:840,y:340};checkpoint=m.cp;activated=false;p={x:35,y:300,vx:0,vy:0,w:26,h:36,ground:false,coyote:0,buffer:0};won=false;msg.textContent='Reach the green portal. Avoid the red spikes.';updateStats()}function updateStats(){stats.textContent='Level '+(level+1)+' · Falls '+falls}function die(){falls++;let spawn=activated?checkpoint:35;p.x=spawn;p.y=300;p.vx=0;p.vy=0;updateStats()}function resize(){let d=Math.min(devicePixelRatio||1,2);c.width=Math.round(c.clientWidth*d);c.height=Math.round(c.clientHeight*d);x.setTransform(c.width/900,0,0,c.height/500,0,0)}window.addEventListener('resize',resize);function bind(id,key){let b=document.getElementById(id);for(let event of ['pointerdown'])b.addEventListener(event,e=>{e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId)});for(let event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys[key]=false)}bind('left','left');bind('right','right');bind('jump','jump');document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space','KeyA','KeyD','KeyW'].includes(e.code))e.preventDefault();if(['ArrowLeft','KeyA'].includes(e.code))keys.left=true;if(['ArrowRight','KeyD'].includes(e.code))keys.right=true;if(['ArrowUp','Space','KeyW'].includes(e.code))keys.jump=true;if(e.code==='KeyR')reset()});document.addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))keys.left=false;if(['ArrowRight','KeyD'].includes(e.code))keys.right=false;if(['ArrowUp','Space','KeyW'].includes(e.code))keys.jump=false});window.addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));document.getElementById('restart').onclick=()=>reset(true);let last=0,acc=0;function step(){if(won)return;p.vx=(Number(keys.right)-Number(keys.left))*4.1;p.buffer=keys.jump?7:Math.max(0,p.buffer-1);p.coyote=p.ground?7:Math.max(0,p.coyote-1);if(p.buffer&&p.coyote){p.vy=-11.6;p.ground=false;p.coyote=0;p.buffer=0}let oldBottom=p.y+p.h;p.vy=Math.min(p.vy+.52,13);p.x=Math.max(0,Math.min(W-p.w,p.x+p.vx));p.y+=p.vy;p.ground=false;for(let a of plats){if(p.vy>=0&&oldBottom<=400&&p.y+p.h>=400&&p.x+p.w>a.x&&p.x<a.x+a.w){p.y=400-p.h;p.vy=0;p.ground=true}}for(let a of spikes){if(p.x+p.w>a.x+4&&p.x<a.x+a.w-4&&p.y+p.h>400&&p.y<418){die();return}}if(p.y>H+60){die();return}if(!activated&&p.ground&&p.x>checkpoint){activated=true;msg.textContent='Checkpoint activated!'}if(p.x+p.w>portal.x&&p.y+p.h>portal.y&&p.y<portal.y+70){if(level<maps.length-1){level++;reset()}else{won=true;msg.textContent='You completed PULSEFALL! Press Restart to play again.'}}}function draw(){x.clearRect(0,0,W,H);let grad=x.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#182447');grad.addColorStop(1,'#0d1225');x.fillStyle=grad;x.fillRect(0,0,W,H);for(let i=0;i<30;i++){x.fillStyle='#32446a';x.fillRect((i*193)%900,(i*71)%320,3,3)}for(let a of plats){x.fillStyle='#3c7c9c';x.fillRect(a.x,400,a.w,24);x.fillStyle='#76d9d3';x.fillRect(a.x,400,a.w,5)}for(let a of spikes){x.fillStyle='#ff5577';for(let i=a.x;i<a.x+a.w;i+=16){x.beginPath();x.moveTo(i,420);x.lineTo(i+8,399);x.lineTo(i+16,420);x.fill()}}x.fillStyle=activated?'#5ef0b6':'#ffd46a';x.fillRect(checkpoint,370,5,30);x.fillStyle='#5cf4a2';x.fillRect(portal.x,340,25,60);x.fillStyle='#a2ecff';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#1c2848';x.fillRect(p.x+16,p.y+8,5,5)}function frame(t){let dt=Math.min(50,t-last);last=t;acc+=dt;let count=0;while(acc>=1000/60&&count++<4){step();acc-=1000/60}draw();requestAnimationFrame(frame)}reset(true);resize();requestAnimationFrame(frame);
</script></html>
